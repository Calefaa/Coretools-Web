<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>COREDEV™ login</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="login.css"
    >

    <!-- Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Rubik:wght@300..900&display=swap"
        rel="stylesheet"
    >

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="../images/corelogo.png"
    >

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <!-- MENU BUTTON -->

        <button
            class="icon-btn"
            aria-label="Abrir menú"
        >

            <img
                src="../images/menu.png"
                alt="Menú"
            >

        </button>

        <!-- LOGO -->

        <h1 class="logo">

            <a href="index.html">
                CORE<sup>DEV™</sup>
            </a>

        </h1>

        <!-- SEARCH -->

        <div class="search-box">

            <input
                id="search"
                type="search"
                placeholder="Buscar..."
                aria-label="Buscar"
            >

            <button
                class="search-btn"
                aria-label="Buscar"
            >

                <img
                    src="../images/search.png"
                    alt="Buscar"
                >

            </button>

        </div>

    </header>

    <!-- MAIN -->

    <main>

        <!-- HERO -->

        <section class="hero">

            <h2 class="hero-title">
                CORE<sup>DEV™</sup>
            </h2>

            <p class="hero-subtitle">
                COMUNIDAD DE PROGRAMACIÓN
            </p>

            <p class="hero-description">
                APRENDE | COMPARTE | CREA
            </p>

            <!-- DISCORD BUTTON -->

            <a
                href="https://discord.gg/yKvbh8w42M"
                target="_blank"
                rel="noopener noreferrer"
                class="discord-btn"
            >

                <img
                    src="../images/chat.png"
                    alt="Discord"
                >

                <span>
                    Unirse al Discord
                </span>

            </a>

            <!-- SESSION BUTTON -->

            <a
                href="login.html"
                target="_blank"
                rel="noopener noreferrer"
                class="login-btn"
            >

                <img
                    src="../images/login.png"
                    alt="Log in"
                >

                <span>
                    Continuar gratis
                </span>

            </a>

        </section>

    </main>

    <!-- FOOTER -->

    <footer class="footer">

        <hr>

        <p>
            © 2026 CORETOOLS™ — All rights reserved.
        </p>

    </footer>

    <!-- JS -->

    <script src="script.js"></script>

</body>

</html>
