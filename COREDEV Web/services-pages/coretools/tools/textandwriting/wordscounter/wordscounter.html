<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CONTADOR DE PALABRAS</title>

    <link
        rel="stylesheet"
        href="wordscounter.css"
    >

    <!-- Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Rubik:wght@300..900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="icon"
        type="image/png"
        href="../../../Images/Corelogo.png"
    >
</head>

<body>

    <header class="header">

        <button
            class="icon-btn"
            aria-label="Abrir menú"
        >
            <img
                src="../../../Images/menu.png"
                alt=""
            >
        </button>

        <h1 class="logo">
            <a href="../../../Principal Page/index.html">
                CORE<sup>TOOLS™</sup>
            </a>
        </h1>

        <div class="search-box">

            <input
                type="search"
                placeholder="Buscar..."
                aria-label="Buscar"
            >

            <button
                class="search-btn"
                aria-label="Buscar"
            >
                <img
                    src="../../../Images/search.png"
                    alt=""
                >
            </button>

        </div>

    </header>

    <main>

        <section class="hero">

            <h2 class="hero-title">
                CONTADOR DE PALABRAS
            </h2>

            <p class="category">
                TEXTO Y ESCRITURA
            </p>

            <p class="description">
                Cuenta automáticamente palabras y caracteres del texto ingresado.
            </p>

        </section>

        <section class="counter-box">

            <div class="stats">

                <div class="stat">
                    <span class="stat-label">Palabras</span>
                    <span
                        class="stat-value"
                        id="words"
                    >
                        0
                    </span>
                </div>

                <div class="stat">
                    <span class="stat-label">Caracteres</span>
                    <span
                        class="stat-value"
                        id="characters"
                    >
                        0
                    </span>
                </div>

            </div>

            <textarea
                id="text"
                class="textarea"
                placeholder="Introduzca el texto aquí..."
            ></textarea>

        </section>

    </main>

    <hr>

    <footer class="footer">
        <p>
            &copy; 2026 CORETOOLS™ — All rights reserved.
        </p>
    </footer>

    <script src="wordscounter.js"></script>

</body>
</html>
